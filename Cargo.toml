[package]
name = "ph-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "A terminal video browser with inline previews, written in Rust"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["cli", "tui", "streaming", "mpv"]
categories = ["command-line-utilities"]

[[bin]]
name = "ph-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.29"
ratatui-image = { version = "9", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "json"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
